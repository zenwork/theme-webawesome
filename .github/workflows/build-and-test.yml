name: Build and Test

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-and-test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install Chromium
        run: deno run -A npm:playwright@1.60.0 install --with-deps chromium

      - name: Lint
        run: deno lint

      - name: Unit tests
        run: deno task test:unit

      - name: Build theme site
        env:
          XDG_CACHE_HOME: ${{ github.workspace }}/_cache/xdg
        run: deno task build

      - name: Build integration test site
        working-directory: test
        env:
          XDG_CACHE_HOME: ${{ github.workspace }}/test/_cache/xdg
        run: deno task build
