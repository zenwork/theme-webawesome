name: Deploy Test Site to GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

permissions:
  contents: write

env:
  PAGES_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}

concurrency:
  group: deploy-${{ github.workflow }}-${{ github.event.pull_request.number || 'main' }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Build and Deploy
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate GitHub Pages token
        env:
          GH_PAGES_TOKEN: ${{ secrets.GH_PAGES_TOKEN }}
        run: |
          if [ -z "$GH_PAGES_TOKEN" ]; then
            echo "::error::Set GH_PAGES_TOKEN to a token that can push gh-pages and manage GitHub Pages settings."
            echo "::error::Use a classic PAT with repo scope, or a fine-grained token with Contents write, Pages write, and Administration write for this repository."
            echo "::error::The default GITHUB_TOKEN can create the gh-pages branch, but it does not trigger a Pages build."
            exit 1
          fi

      # Clean up PR Preview when PR is closed
      - name: Checkout gh-pages branch (Cleanup)
        if: github.event_name == 'pull_request' && github.event.action == 'closed'
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: gh-pages
          token: ${{ secrets.GH_PAGES_TOKEN }}

      - name: Clean up PR Preview Directory
        if: github.event_name == 'pull_request' && github.event.action == 'closed'
        run: |
          PR_DIR="preview/PR-${{ github.event.pull_request.number }}"
          if [ -d "$PR_DIR" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git rm -rf "$PR_DIR"
            git commit -m "chore(cleanup): remove preview for PR #${{ github.event.pull_request.number }}"
            git push origin gh-pages
          else
            echo "No preview directory found for PR #${{ github.event.pull_request.number }}"
          fi

      # Build & Deploy steps for Push and Active PRs
      - name: Setup Deno
        if: github.event.action != 'closed'
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Build test site for PR Preview
        if: github.event_name == 'pull_request' && github.event.action != 'closed'
        working-directory: test
        env:
          XDG_CACHE_HOME: ${{ github.workspace }}/test/_cache/xdg
        run: |
          deno task build --location "${PAGES_BASE_URL}/preview/PR-${{ github.event.pull_request.number }}/"

      - name: List _site contents for PR Preview
        if: github.event_name == 'pull_request' && github.event.action != 'closed'
        working-directory: test
        run: |
          echo "Contents of test/_site:"
          ls -R _site

      - name: Build test site for Production
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: test
        env:
          XDG_CACHE_HOME: ${{ github.workspace }}/test/_cache/xdg
        run: |
          deno task build --location "${PAGES_BASE_URL}/"

      - name: Deploy PR Preview
        if: github.event_name == 'pull_request' && github.event.action != 'closed'
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.GH_PAGES_TOKEN }}
          publish_dir: test/_site
          publish_branch: gh-pages
          destination_dir: preview/PR-${{ github.event.pull_request.number }}
          keep_files: true

      - name: Deploy Production Site
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.GH_PAGES_TOKEN }}
          publish_dir: test/_site
          publish_branch: gh-pages
          keep_files: true

      - name: Configure GitHub Pages source
        if: github.event.action != 'closed'
        env:
          GH_PAGES_TOKEN: ${{ secrets.GH_PAGES_TOKEN }}
        run: |
          pages_api="https://api.github.com/repos/${{ github.repository }}/pages"
          pages_source='{"source":{"branch":"gh-pages","path":"/"}}'
          status="$(
            curl -sS -o /tmp/pages-response.json -w "%{http_code}" \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_PAGES_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$pages_api"
          )"

          if [ "$status" = "404" ]; then
            curl -fsS -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_PAGES_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$pages_api" \
              -d "$pages_source"
          elif [ "$status" = "200" ]; then
            curl -fsS -X PUT \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_PAGES_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$pages_api" \
              -d "$pages_source"
          else
            cat /tmp/pages-response.json
            exit 1
          fi
